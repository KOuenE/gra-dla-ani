<!doctype html>
<html lang="pl"><head><meta charset="utf-8">

<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2a1030">
<title>Dla Ani ♥</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 56 C8 40 4 22 18 14 C26 10 32 18 32 22 C32 18 38 10 46 14 C60 22 56 40 32 56Z' fill='%23ff4d7d'/%3E%3C/svg%3E">
<style>
  :root{--pink:#ff4d7d;--pink2:#ff7aa2;--deep:#a51f4b;--txt:#ffe3ee;--sub:#f6c6d8}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;background:#1c0a22;color:#fff;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;padding:16px;
       background:radial-gradient(120% 90% at 50% 30%,#8a3478 0%,#4a1a52 45%,#1c0a22 100%)}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;
       background:radial-gradient(40vmax 40vmax at 15% 85%,rgba(255,110,160,.18),transparent 70%),radial-gradient(35vmax 35vmax at 85% 15%,rgba(255,170,120,.14),transparent 70%)}
  .card{position:relative;z-index:2;width:min(100%,360px);padding:30px 24px 22px;border-radius:28px;text-align:center;
        background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.06));border:1.5px solid rgba(255,190,215,.45);
        backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 24px 60px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.25);
        animation:pop .6s cubic-bezier(.2,1.4,.4,1) both;transition:opacity .45s,transform .45s}
  .card.out{opacity:0;transform:scale(.92) translateY(-10px)}
  @keyframes pop{from{opacity:0;transform:scale(.85) translateY(20px)}}
  .heart{width:76px;height:76px;margin:0 auto;animation:beat 1.2s infinite;filter:drop-shadow(0 8px 14px rgba(255,60,120,.55))}
  .busy .heart{animation-duration:.6s}
  @keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.16)}30%{transform:scale(1)}45%{transform:scale(1.1)}}
  h1{margin:12px 0 4px;font-size:28px;letter-spacing:.5px;color:var(--txt);text-shadow:0 2px 12px rgba(255,80,140,.45)}
  p{margin:0 0 20px;color:var(--sub);font-size:15px;line-height:1.4}
  .field{position:relative}
  input{width:100%;font-size:19px;padding:14px 50px;border-radius:16px;border:2px solid #ff9ab9;background:#fff;color:#3a1540;outline:none;text-align:center;letter-spacing:2px;transition:border-color .2s,box-shadow .2s}
  input::placeholder{letter-spacing:0;color:#c49ab0}
  input:focus{border-color:var(--pink);box-shadow:0 0 0 4px rgba(255,77,125,.28)}
  .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:40px;height:40px;margin:0;padding:0;border:0;border-radius:12px;
       background:transparent;box-shadow:none;color:#b0688a;cursor:pointer;display:grid;place-items:center}
  .eye:hover{background:#ffe9f1}.eye:active{transform:translateY(-50%)}
  .eye svg{width:22px;height:22px}
  button.go{position:relative;margin-top:14px;width:100%;font-size:18px;font-weight:bold;padding:14px;border:0;border-radius:16px;color:#fff;cursor:pointer;
       font-family:inherit;background:linear-gradient(#ff86ab,#e8356b);box-shadow:0 5px 0 var(--deep),0 10px 20px rgba(232,53,107,.35);transition:filter .2s}
  button.go:hover{filter:brightness(1.06)}
  button.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--deep)}
  button.go:disabled{cursor:progress;filter:saturate(.7) brightness(.95)}
  .spin{display:none;width:18px;height:18px;margin-right:8px;vertical-align:-3px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:rot .8s linear infinite}
  .busy .spin{display:inline-block}
  @keyframes rot{to{transform:rotate(360deg)}}
  .msg{min-height:22px;margin-top:14px;font-size:14px;color:#ffd1dc;transition:opacity .2s}
  .msg.err{color:#ffb3c6;font-weight:bold}
  .shake{animation:shake .4s}
  @keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  .fl{position:fixed;bottom:-40px;z-index:1;color:#ff6b95;animation:up linear infinite;pointer-events:none;will-change:transform}
  @keyframes up{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(-58vh) translateX(18px) rotate(12deg)}100%{transform:translateY(-118vh) rotate(25deg)}}
  .veil{position:fixed;inset:0;z-index:5;background:#1d120b;opacity:0;pointer-events:none;transition:opacity .45s}
  .veil.on{opacity:1}
  .auto .card{opacity:0;animation:none}
  @media (prefers-reduced-motion:reduce){.fl{display:none}.heart,.card{animation:none}}
</style></head>
<body>
<div class="card" id="card">
  <svg class="heart" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="hg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff86ab"/><stop offset="1" stop-color="#e8235f"/></linearGradient></defs><path d="M32 56 C8 40 4 22 18 14 C26 10 32 18 32 22 C32 18 38 10 46 14 C60 22 56 40 32 56Z" fill="url(#hg)"/><ellipse cx="21" cy="22" rx="5" ry="3.2" fill="#fff" opacity=".55" transform="rotate(-30 21 22)"/></svg>
  <h1>Dla Ani</h1>
  <p>Wpisz hasło, żeby otworzyć niespodziankę</p>
  <form id="f" autocomplete="off">
    <div class="field">
      <input id="pw" type="password" placeholder="hasło" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="Hasło" required>
      <button type="button" class="eye" id="eye" aria-label="Pokaż hasło"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path id="slash" d="M4 4l16 16" style="display:none"/></svg></button>
    </div>
    <button type="submit" class="go" id="go"><span class="spin"></span><span id="golbl">Otwórz ♥</span></button>
  </form>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>
</div>
<div class="veil" id="veil"></div>

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
for (let i = 0; i < (reduce ? 0 : 16); i++) { const h = document.createElement('div'); h.className = 'fl'; h.textContent = '❤';
  h.style.left = (Math.random() * 100) + 'vw'; h.style.fontSize = (12 + Math.random() * 24) + 'px'; h.style.opacity = (.35 + Math.random() * .4).toFixed(2);
  h.style.animationDuration = (8 + Math.random() * 9) + 's'; h.style.animationDelay = (-Math.random() * 14) + 's'; document.body.appendChild(h); }
const $ = (id) => document.getElementById(id);
const u8 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const norm = (p) => p.toLowerCase().normalize('NFC').replace(/[^0-9a-ząćęłńóśźż]/g, '');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
async function open(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm(pw)), 'PBKDF2', false, ['deriveKey']);
  for (const w of D.w) {
    const kek = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: u8(w.s), iterations: D.it, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    let raw;
    try { raw = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(w.i) }, kek, u8(w.k)); } catch (_) { continue; }
    const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(D.iv) }, key, u8(D.ct));
    return new TextDecoder().decode(plain);
  }
  throw new Error('bad password');
}
let busy = false;
function setBusy(on) {
  busy = on; document.body.classList.toggle('busy', on);
  $('go').disabled = on; $('golbl').textContent = on ? 'Otwieram…' : 'Otwórz ♥';
}
async function tryOpen(pw, auto) {
  if (busy) return;
  const msg = $('msg');
  if (!window.crypto || !crypto.subtle) { msg.className = 'msg err'; msg.textContent = 'Ta przeglądarka nie obsługuje odszyfrowania. Otwórz stronę przez https ♥'; return; }
  setBusy(true); msg.className = 'msg'; msg.textContent = '';
  try {
    const html = await open(pw);
    try { localStorage.setItem('ania-pw', pw); } catch (_) {}
    if (!auto) { $('card').classList.add('out'); }
    $('veil').classList.add('on');
    await wait(auto ? 150 : 450);
    document.open(); document.write(html); document.close();
  } catch (e) {
    try { localStorage.removeItem('ania-pw'); } catch (_) {}
    document.body.classList.remove('auto'); setBusy(false);
    if (auto) return;
    msg.className = 'msg err'; msg.textContent = 'Złe hasło, spróbuj jeszcze raz ♥';
    const c = $('card'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake');
    $('pw').select();
  }
}
$('f').addEventListener('submit', (e) => { e.preventDefault(); tryOpen($('pw').value, false); });
$('eye').addEventListener('click', () => {
  const p = $('pw'), show = p.type === 'password'; p.type = show ? 'text' : 'password';
  $('slash').style.display = show ? '' : 'none'; $('eye').setAttribute('aria-label', show ? 'Ukryj hasło' : 'Pokaż hasło'); p.focus();
});
